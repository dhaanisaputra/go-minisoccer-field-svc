name: field-service
services:
  field-service:
    container_name: field-service
    image: dansss/field-service
    build: .
    ports:
      - "8003:8003"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway" # biar bisa manggil user-service di host
    volumes:
      # kalau file belum ada, salin dulu: cp config.docker.example.json config.docker.json
      - ./config.docker.json:/app/config.json
    depends_on:
      - postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: go-field-service
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
