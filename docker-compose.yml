name: field-service
services:
  field-service:
    container_name: field-service
    image: dansss/field-service
    build: .
    ports:
      - "8003:8003"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway" # biar bisa manggil user-service di host
    volumes:
      # kalau file belum ada, salin dulu: cp config.docker.example.json config.docker.json
      - ./config.docker.json:/app/config.json
    depends_on:
      - postgres
      - minio
  minio:
    container_name: minio
    image: minio/minio:latest
    command: server /data --console-address :9001
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: go-field-service
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  miniodata:
